name: Release

# Builds standalone tetron-wm binaries and attaches them to the GitHub Release, so
# users can install with the curl | sh installer without a Rust toolchain.
#
# Three ways to cut a release, all converging on the same build+publish job:
#   * push a tag  v*            — the classic manual tag.
#   * merge a Cargo.toml bump   — a push to main whose version is new auto-tags
#                                 and releases. No tag push needed, so an agent
#                                 that can only open/merge PRs can still ship.
#   * workflow_dispatch         — type a tag by hand from the Actions tab.

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  # Decide whether this event should cut a release, and under which tag. A push
  # to main releases only when Cargo.toml's version changed to a tag that does
  # not yet exist — so ordinary merges are free and a version bump is the single
  # release trigger. Tag pushes and manual dispatches always release.
  decide:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.d.outputs.release }}
      tag: ${{ steps.d.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          fetch-tags: ${{ github.ref_type != 'tag' }}
      - id: d
        run: |
          ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >>"$GITHUB_OUTPUT"
            echo "release=true" >>"$GITHUB_OUTPUT"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >>"$GITHUB_OUTPUT"
            echo "release=true" >>"$GITHUB_OUTPUT"
          else
            # push to main: release only when the version is new.
            tag="v$ver"
            prev="$(git show HEAD~1:Cargo.toml 2>/dev/null | grep -m1 '^version' | sed -E 's/.*"(.*)".*/\1/' || true)"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "release=false" >>"$GITHUB_OUTPUT"
              echo "Tag $tag already exists — nothing to release."
            elif [ "$ver" = "$prev" ]; then
              echo "release=false" >>"$GITHUB_OUTPUT"
              echo "Version unchanged ($ver) — nothing to release."
            else
              echo "tag=$tag" >>"$GITHUB_OUTPUT"
              echo "release=true" >>"$GITHUB_OUTPUT"
              echo "New version $ver — will cut $tag."
            fi
          fi

      # Pre-create the tag + release ONCE, before the build matrix fans out.
      # Without this, the four platform jobs race to create the release via
      # action-gh-release; the v0.2.11 run left the loser holding an orphaned
      # draft release with its binary while the real release shipped 3 of 4
      # assets. With the release existing up front, builders only ever attach.
      - name: Create release up front
        if: steps.d.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.d.outputs.tag }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$tag" \
              --notes "See CHANGELOG.md for the full release notes."

  build:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets build on the Apple-Silicon runner: it has the
          # x86_64 SDK, so it cross-compiles the Intel binary without depending
          # on the heavily-backlogged macos-13 (Intel) runner.
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # Linux builds run on 22.04 ON PURPOSE: its glibc 2.35 keeps the
          # binaries runnable on Debian 12 (glibc 2.36) and Ubuntu 22.04+ —
          # ubuntu-latest (24.04, glibc 2.39) produced binaries that died on
          # Debian with "GLIBC_2.39 not found".
          # deb_arch: these two also ship a .deb (WMDEB-006). 22.04's glibc
          # 2.35 is the package's libc6 floor: Debian 12+, Ubuntu 22.04+.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, deb_arch: amd64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, deb_arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      # Guard against the release-engineering bug that once shipped 0.2.3
      # binaries under a v0.2.4 tag (the tag was cut on the pre-bump commit):
      # the prebuilt binary reported an older version than the tag, so the
      # in-app updater saw a perpetual "update available" and looped forever.
      # Fail the build when the tag and the source version disagree, rather
      # than publishing binaries that can never satisfy the version check.
      - name: Verify tag matches Cargo.toml version
        run: |
          want="${{ needs.decide.outputs.tag }}"; want="${want#v}"
          have="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "release tag: $want | Cargo.toml: $have"
          if [ "$want" != "$have" ]; then
            echo "::error::Release tag v$want does not match Cargo.toml version $have — bump Cargo.toml or re-tag the right commit."
            exit 1
          fi

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: tar -C target/${{ matrix.target }}/release -czf tetron-wm-${{ matrix.target }}.tar.gz tetron-wm

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag (at this run's commit) and the release if missing,
          # else attaches to the existing tag's release.
          tag_name: ${{ needs.decide.outputs.tag }}
          body: "See CHANGELOG.md for the full release notes."
          files: tetron-wm-${{ matrix.target }}.tar.gz

      # .deb for Debian and Ubuntu (WMDEB-006, spec/packaging.py), built from the
      # binary packaged above by the shared build-deb action, pinned to a full
      # commit SHA. The action installs the deb in a clean debian:trixie
      # container on the runner's own architecture and fails the job before the
      # upload if that test fails. install.sh finds the asset by its name,
      # tetron-wm_<version>-<rev>_<arch>.deb (WMDEB-005). Maintainer comes from
      # the repository variable DEB_MAINTAINER.
      - name: Build .deb
        id: deb
        if: matrix.deb_arch != ''
        uses: tetronos/tetron-packaging@87d8405791a0e679af6deb720fe932410f38feb5
        with:
          binary: target/${{ matrix.target }}/release/tetron-wm
          deb-toml: packaging/deb.toml
          version: ${{ needs.decide.outputs.tag }}
          arch: ${{ matrix.deb_arch }}
          maintainer: ${{ vars.DEB_MAINTAINER }}
          smoke: tetron-wm --version

      - name: Attach .deb to release
        if: matrix.deb_arch != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.decide.outputs.tag }}
          files: |
            ${{ steps.deb.outputs.deb }}
            ${{ steps.deb.outputs.sha256 }}

      # tetron-wm-desktop (WMDEB-007), tetron-wm-essentials (WMDEB-010),
      # tetron-wm-recommended (WMDEB-011) and tetron-wm-extras (WMDEB-009) are
      # metapackages (Architecture all), so they are built once, on the amd64
      # job. The action's own install test would install each alone, where its
      # tetron-wm dependency is not in any archive, and without Recommends;
      # instead test-metapackages.sh installs all five debs together,
      # Recommends included, and checks every Recommends installed and no
      # Suggests (an SSH server, for example) pulled in.
      - name: Build tetron-wm-desktop .deb
        id: desktop
        if: matrix.deb_arch == 'amd64'
        uses: tetronos/tetron-packaging@87d8405791a0e679af6deb720fe932410f38feb5
        with:
          deb-toml: packaging/desktop.toml
          version: ${{ needs.decide.outputs.tag }}
          maintainer: ${{ vars.DEB_MAINTAINER }}
          out: deb-desktop-out
          test: "false"

      - name: Build tetron-wm-essentials .deb
        id: essentials
        if: matrix.deb_arch == 'amd64'
        uses: tetronos/tetron-packaging@87d8405791a0e679af6deb720fe932410f38feb5
        with:
          deb-toml: packaging/essentials.toml
          version: ${{ needs.decide.outputs.tag }}
          maintainer: ${{ vars.DEB_MAINTAINER }}
          out: deb-essentials-out
          test: "false"

      - name: Build tetron-wm-recommended .deb
        id: recommended
        if: matrix.deb_arch == 'amd64'
        uses: tetronos/tetron-packaging@87d8405791a0e679af6deb720fe932410f38feb5
        with:
          deb-toml: packaging/recommended.toml
          version: ${{ needs.decide.outputs.tag }}
          maintainer: ${{ vars.DEB_MAINTAINER }}
          out: deb-recommended-out
          test: "false"

      - name: Build tetron-wm-extras .deb
        id: extras
        if: matrix.deb_arch == 'amd64'
        uses: tetronos/tetron-packaging@87d8405791a0e679af6deb720fe932410f38feb5
        with:
          deb-toml: packaging/extras.toml
          version: ${{ needs.decide.outputs.tag }}
          maintainer: ${{ vars.DEB_MAINTAINER }}
          out: deb-extras-out
          test: "false"

      - name: Test the metapackages with their Recommends
        if: matrix.deb_arch == 'amd64'
        run: packaging/test-metapackages.sh "${{ steps.deb.outputs.deb }}" "${{ steps.desktop.outputs.deb }}" "${{ steps.essentials.outputs.deb }}" "${{ steps.recommended.outputs.deb }}" "${{ steps.extras.outputs.deb }}"

      - name: Attach the metapackages to release
        if: matrix.deb_arch == 'amd64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.decide.outputs.tag }}
          files: |
            ${{ steps.desktop.outputs.deb }}
            ${{ steps.desktop.outputs.sha256 }}
            ${{ steps.essentials.outputs.deb }}
            ${{ steps.essentials.outputs.sha256 }}
            ${{ steps.recommended.outputs.deb }}
            ${{ steps.recommended.outputs.sha256 }}
            ${{ steps.extras.outputs.deb }}
            ${{ steps.extras.outputs.sha256 }}
