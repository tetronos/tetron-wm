# tetron-wm-essentials: a metapackage for mkdeb (no binary, Architecture all).
# Built once per release by the build-deb action. Spec: spec/packaging.py (WMDEB-010).
#
# The essentials size: tetron-wm-desktop (tetron-wm and the tools its features
# use) plus the apps a working machine should have, one good pick per need.
# The recommends array is written by scripts/gen_suite_lists.py from the
# "App sets" section of lists/tetron.toml (set = "essentials"). Apps no
# distribution packages (opencode, fresh, uv, ...) come with the suite
# installer (its [[script]] entries).
name = "tetron-wm-essentials"
description = "tetron-wm with its tools and the essential terminal apps"
long_description = """
Installs tetron-wm-desktop (tetron-wm and the tools its features use) and
the apps a working terminal machine should have, one good pick per need:
files and disks (tree, gdu, gdisk, parted, rsync), system (pstree,
fastfetch, qalc, bc, earlyoom, systemd-timesyncd), editors (nano), web
(wget, lynx), network (tmux, mosh, dig, traceroute, whois, netcat),
images (timg), programming (git, jq, ripgrep, fd, fzf, man, tldr) and
sound (pulsemixer).

Each app is a Recommends, so it can be removed later without removing this
package; a name a release does not have is skipped."""
section = "metapackages"
license = "MIT"
homepage = "https://github.com/tetronos/tetron-wm"
depends = ["tetron-wm-desktop (>= {minor})"]
recommends = [
  "git",
  "tree",
  "gdisk",
  "rsync",
  "parted",
  "psmisc",
  "fastfetch",
  "qalc",
  "bc",
  "earlyoom",
  "systemd-timesyncd",
  "nano",
  "wget",
  "mosh",
  "bind9-dnsutils",
  "traceroute",
  "whois",
  "netcat-openbsd",
  "jq",
  "ripgrep",
  "fd-find",
  "man-db",
  "tealdeer",
  "pulsemixer",
  "fzf",
  "gdu",
  "lynx",
  "timg",
  "tmux",
]
files = []
