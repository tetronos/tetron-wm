# tetron-wm-extras: a metapackage for mkdeb (no binary, Architecture all).
# Built once per release by the build-deb action. Spec: spec/packaging.py (WMDEB-009).
#
# The largest size: tetron-wm-recommended plus apps added over time beyond it.
# The recommends array is written by scripts/gen_suite_lists.py from the
# "App sets" section of lists/tetron.toml (set = "extras"); empty for now.
name = "tetron-wm-extras"
description = "tetron-wm with the recommended and extra terminal apps"
long_description = """
Installs tetron-wm-recommended (tetron-wm, its tools, the essential and
recommended apps) and the extra apps added over time beyond them.

Each is a Recommends, so it can be removed later without removing this
package."""
section = "metapackages"
license = "MIT"
homepage = "https://github.com/tetronos/tetron-wm"
depends = ["tetron-wm-recommended (>= {minor})"]
recommends = []
files = []
