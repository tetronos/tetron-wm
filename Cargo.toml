[package]
name = "tetron-wm"
version = "0.15.25"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "A TUI desktop environment for the terminal"
repository = "https://github.com/tetronos/tetron-wm"

[dependencies]
# Drive discovery and mounting for the Files app; a library crate so it moves with Files.
tetron-drives = { path = "crates/tetron-drives" }
# The app catalog library, from tetron-appstore (WMCAT-008, WMCAT-012), pinned
# to a release tag (WMDEP-001).
tetron-catalog = { git = "https://github.com/tetronos/tetron-appstore", tag = "v0.15.2" }
crossterm = "0.29"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
toml_edit = "0.25"
dirs = "5"
alacritty_terminal = "0.26.0"
serde_json = "1.0.150"
sysinfo = "0.39"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
infer = "0.19"
mime_guess = "2"
base64 = "0.22"
flate2 = "1"
libc = "0.2"
memchr = "2"
# tetron (P2P mesh VPN) IPC: the message enum + wire types, the single source of
# truth shared with tetron-systray and tetron-webui. We only read Status, framed
# ourselves synchronously (4-byte BE length + msgpack) so we avoid tetron-proto's
# async/tokio client helpers in the poller. rmp-serde does that framing.
# Pinned to a tetron core release tag of this minor (WMDEP-001); moved by
# contrib/bump-proto.sh. Both are optional, behind the `mesh` feature (WMDEP-004).
tetron-proto = { git = "https://github.com/tetronos/tetron", tag = "v0.15.8", optional = true }
rmp-serde = { version = "1", optional = true }

[features]
# The tetron mesh status and actions in the menubar (WMDEP-004). Off gives a
# window manager with no tetron core dependency.
default = ["mesh"]
mesh = ["dep:tetron-proto", "dep:rmp-serde"]

[lib]
# Underscore: a lib target name must be a valid Rust identifier (used in `use
# tetron_wm::...`). The package and binary are the hyphenated `tetron-wm`.
name = "tetron_wm"
path = "src/lib.rs"

[[bin]]
name = "tetron-wm"
path = "src/main.rs"

[dev-dependencies]
# Tests read only the built-in catalog, never a downloaded one (WMCAT-008).
tetron-catalog = { git = "https://github.com/tetronos/tetron-appstore", tag = "v0.15.2", features = ["builtin-only"] }

[workspace]
members = ["crates/tetron-drives"]
