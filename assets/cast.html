<!doctype html>
<html><head><meta charset="utf-8"><title>tetron-wm</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}
#o{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#fff;background:#000a;font:4vh monospace}</style></head>
<body><canvas id="c"></canvas><div id="o"></div>
<script>
"use strict";
// Paints the cell grid sent by the tetron-wm cast server. No external requests.
const cv = document.getElementById("c"), ctx = cv.getContext("2d"), ov = document.getElementById("o");
const FONT = '"DejaVu Sans Mono","Noto Sans Mono","Roboto Mono",monospace';
let cols = 0, rows = 0, cw = 0, ch = 0, ox = 0, oy = 0, grid = [], cur = null, dirty = new Set(), full = true;
const hex = v => { const a = v >>> 0; return [a >>> 24, (a >>> 16) & 255, (a >>> 8) & 255, a & 255]; };
const css = v => { const [r, g, b, a] = hex(v); return a ? "rgb(" + r + "," + g + "," + b + ")" : "#000"; };

function layout() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  if (!cols) return;
  // Uniform cell size that fits the grid; cells are about twice as tall as wide.
  cw = Math.max(1, Math.floor(Math.min(cv.width / cols, cv.height / (rows * 2))));
  ch = cw * 2; ox = Math.floor((cv.width - cw * cols) / 2); oy = Math.floor((cv.height - ch * rows) / 2);
  full = true;
}
addEventListener("resize", () => { layout(); schedule(); });

function setCell(x, y, bg, fg, at, c) { grid[y * cols + x] = [bg, fg, at, c]; dirty.add(y * cols + x); }

function blockRects(code, x, y) {
  // Quadrant bits: 1 UL, 2 UR, 4 LL, 8 LR. Returns [x0, y0, x1, y1] in cell fractions.
  const q = { 0x2596: 4, 0x2597: 8, 0x2598: 1, 0x2599: 1 | 4 | 8, 0x259A: 1 | 8, 0x259B: 1 | 2 | 4, 0x259C: 1 | 2 | 8, 0x259D: 2, 0x259E: 2 | 4, 0x259F: 2 | 4 | 8 };
  const r = [];
  if (code === 0x2580) r.push([0, 0, 1, .5]);
  else if (code >= 0x2581 && code <= 0x2588) r.push([0, 1 - (code - 0x2580) / 8, 1, 1]);
  else if (code >= 0x2589 && code <= 0x258F) r.push([0, 0, (0x2590 - code) / 8, 1]);
  else if (code === 0x2590) r.push([.5, 0, 1, 1]);
  else if (code === 0x2594) r.push([0, 0, 1, 1 / 8]);
  else if (code === 0x2595) r.push([7 / 8, 0, 1, 1]);
  else if (q[code]) { const m = q[code]; if (m & 1) r.push([0, 0, .5, .5]); if (m & 2) r.push([.5, 0, 1, .5]); if (m & 4) r.push([0, .5, .5, 1]); if (m & 8) r.push([.5, .5, 1, 1]); }
  else return null;
  return r;
}

function boxLines(code) {
  // Light(1)/heavy(2)/double(3) segments as [left, right, up, down] weights for common glyphs.
  const t = {
    0x2500: [1, 1, 0, 0], 0x2501: [2, 2, 0, 0], 0x2502: [0, 0, 1, 1], 0x2503: [0, 0, 2, 2],
    0x250C: [0, 1, 0, 1], 0x2510: [1, 0, 0, 1], 0x2514: [0, 1, 1, 0], 0x2518: [1, 0, 1, 0],
    0x251C: [0, 1, 1, 1], 0x2524: [1, 0, 1, 1], 0x252C: [1, 1, 0, 1], 0x2534: [1, 1, 1, 0], 0x253C: [1, 1, 1, 1],
    0x2550: [3, 3, 0, 0], 0x2551: [0, 0, 3, 3], 0x2554: [0, 3, 0, 3], 0x2557: [3, 0, 0, 3], 0x255A: [0, 3, 3, 0], 0x255D: [3, 0, 3, 0],
    0x2560: [0, 3, 3, 3], 0x2563: [3, 0, 3, 3], 0x2566: [3, 3, 0, 3], 0x2569: [3, 3, 3, 0], 0x256C: [3, 3, 3, 3],
    0x256D: [0, 1, 0, 1], 0x256E: [1, 0, 0, 1], 0x256F: [1, 0, 1, 0], 0x2570: [0, 1, 1, 0]
  };
  return t[code] || null;
}

function paint(x, y) {
  const g = grid[y * cols + x]; if (!g) return;
  let [bg, fg, at, c] = g;
  if (at & 8) { const t = bg; bg = fg; fg = t; }
  const px = ox + x * cw, py = oy + y * ch;
  ctx.fillStyle = css(bg); ctx.fillRect(px, py, cw, ch);
  paintGlyph(px, py, fg, at, c);
  if (cur && cur.x === x && cur.y === y) { ctx.fillStyle = css(fg); ctx.fillRect(px, py, cw, ch); paintGlyph(px, py, bg, at, c); }
}

function paintGlyph(px, py, fg, at, c) {
  if (c === " " || !c) return;
  const code = c.codePointAt(0);
  ctx.fillStyle = css(fg); ctx.strokeStyle = css(fg);
  const rects = (code >= 0x2580 && code <= 0x259F) ? blockRects(code) : null;
  if (rects) {
    for (const [a, b, e, d] of rects) { const x0 = px + Math.round(a * cw), x1 = px + Math.round(e * cw), y0 = py + Math.round(b * ch), y1 = py + Math.round(d * ch); ctx.fillRect(x0, y0, x1 - x0, y1 - y0); }
    if (code >= 0x2591 && code <= 0x2593) { ctx.globalAlpha = (code - 0x2590) / 4; ctx.fillRect(px, py, cw, ch); ctx.globalAlpha = 1; }
    return;
  }
  const bl = (code >= 0x2500 && code <= 0x257F) ? boxLines(code) : null;
  if (bl) {
    const mx = px + Math.floor(cw / 2), my = py + Math.floor(ch / 2), th = Math.max(1, Math.round(cw / 8));
    const seg = (w, x0, y0, x1, y1, horiz) => {
      if (!w) return;
      const t = w === 2 ? th * 2 : th;
      if (w === 3) { const o = th * 1.5; const a = horiz ? [[x0, y0 - o, x1, y0 - o + th], [x0, y0 + o - th, x1, y0 + o]] : [[x0 - o, y0, x0 - o + th, y1], [x0 + o - th, y0, x0 + o, y1]]; for (const r of a) ctx.fillRect(r[0], r[1], r[2] - r[0], r[3] - r[1]); }
      else if (horiz) ctx.fillRect(x0, y0 - (t >> 1), x1 - x0, t); else ctx.fillRect(x0 - (t >> 1), y0, t, y1 - y0);
    };
    const [l, r, u, d] = bl;
    seg(l, px, my, mx + th, my, true); seg(r, mx - th, my, px + cw, my, true);
    seg(u, mx, py, mx, my + th, false); seg(d, mx, my - th, mx, py + ch, false);
    return;
  }
  ctx.font = (at & 2 ? "italic " : "") + (at & 1 ? "bold " : "") + Math.floor(ch * 0.8) + "px " + FONT;
  ctx.textBaseline = "alphabetic";
  ctx.fillText(c, px, py + Math.floor(ch * 0.78), cw);
  if (at & 4) ctx.fillRect(px, py + ch - Math.max(1, Math.round(ch / 14)), cw, Math.max(1, Math.round(ch / 14)));
}

let pending = false;
function schedule() { if (!pending) { pending = true; requestAnimationFrame(draw); } }
function draw() {
  pending = false;
  if (full) { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cv.width, cv.height); for (let i = 0; i < grid.length; i++) if (grid[i]) paint(i % cols, (i / cols) | 0); full = false; }
  else for (const i of dirty) paint(i % cols, (i / cols) | 0);
  dirty.clear();
}

function spans(list) {
  for (const [x, y, fg, bg, at, text] of list) { let i = 0; for (const c of text) { if (x + i < cols && y < rows) setCell(x + i, y, bg, fg, at, c); i++; } }
}
function setCursor(n) {
  if (cur) dirty.add(cur.y * cols + cur.x);
  cur = n; if (cur) dirty.add(cur.y * cols + cur.x);
}
function banner(t) { ov.textContent = t || ""; ov.style.display = t ? "flex" : "none"; }

const es = new EventSource("events");
es.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.t === "hello") { cols = m.cols; rows = m.rows; grid = new Array(cols * rows); cur = null; dirty.clear(); layout(); banner(""); }
  else if (m.t === "full" || m.t === "diff") { spans(m.spans); }
  else if (m.t === "cursor") { setCursor(m.x == null ? null : { x: m.x, y: m.y }); }
  else if (m.t === "status") { banner(m.state === "detached" ? "tetron-wm is detached" : m.state === "stopped" ? "cast stopped" : ""); }
  schedule();
};
es.onerror = () => banner("reconnecting...");
layout();
</script></body></html>
