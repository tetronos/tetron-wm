# Our app list (WMCAT-001): hand-maintained, wins over every imported list.
#
# [[app]] adds an app found on no other list, or annotates one from any list
# (matched by name in any case, then by command name). Only the fields given
# here override the imported ones. Fields: name, bin, category, description,
# homepage, cli, needs_url, distinct (true: a different app than a listed one
# with the same name or command; never matched), tier (default | recommended | optional), recipe
# (install, method, verified, os, requires_cwd, tip: the upstream way, never a
# distro package manager), pkg (apt, dnf, pacman, brew: package names; they
# override lists/repology.json name by name, "" removes one), variants (suffix,
# args, warn). After an edit run: python3 scripts/merge_catalog.py

# Imported names dropped from the catalog: libraries, collections, duplicates.
exclude = [
  "termui",         # Go widget library, not a runnable app
  "iconicfonts",    # patched-font collection, not a runnable app
  "learnbyexample", # collection of separate tutorial apps, no single binary
  "carbonyl",       # Chromium in the terminal; tetron-browser covers the web (USER 2026-11-08)
  "dua-cli",        # same app as dua (command dua)
]

# ── App sets (WMINST-001) ────────────────────────────────────────
# The sets of apps the size packages and the suite installer install:
# desktop (tetron-wm-desktop, the tools tetron-wm's own features call),
# essentials (tetron-wm-essentials, Depends tetron-wm-desktop), recommended
# (tetron-wm-recommended, Depends tetron-wm-essentials), extras
# (tetron-wm-extras, Depends tetron-wm-recommended). Suite installer sizes:
# minimal (tetron-wm only), essentials (desktop and essentials), recommended,
# extras; each includes the smaller ones.
#
# [[package]]: a set member that is not a Store app. name is the Debian name;
#   check tells the app is present: a command on PATH ("a|b" for
#   alternatives), "font=NAME" (fontconfig) or "consolefonts"; without check
#   it is only in the deb (Debian and Ubuntu). group "gui": only with a
#   desktop session; "services": a Suggests of the deb, offered by the suite
#   installer as a separate question that defaults to no. apt, dnf, pacman,
#   brew: the name there, missing = name, "" = not on that system (one
#   unknown name makes dnf refuse a whole batch, so each was checked in a
#   container or against formulae.brew.sh). deb: the Recommends relation when
#   it is not the apt name ("7zip | p7zip-full").
# [[app]] with set: a Store app in a set; check is its bin, names its pkg.
# [[script]]: an app no distribution packages; the suite installer runs its
#   own method (how) when the size includes its set.
# After an edit run: scripts/rebuild-app-sets.sh (gen_suite_lists.py, then
# merge_catalog.py, then their checks and tests).

# [[release]]: where a set member comes from when the system's package
#   manager has none (Ubuntu 24.04 lacks several Debian 13 has): its GitHub
#   repo and the release asset per architecture (amd64, arm64; `*` matches the
#   version). A .deb installs with apt on Debian and Ubuntu; a .tar.gz puts the
#   member's check command into ~/.local/bin. Checked against the SHA256 digest
#   GitHub lists for the asset (WMINST-015).

[[release]]
name = "fastfetch"
repo = "fastfetch-cli/fastfetch"
amd64 = "fastfetch-linux-amd64.deb"
arm64 = "fastfetch-linux-aarch64.deb"

[[release]]
name = "glow"
repo = "charmbracelet/glow"
amd64 = "glow_*_amd64.deb"
arm64 = "glow_*_arm64.deb"

[[release]]
name = "xh"
repo = "ducaale/xh"
amd64 = "xh-*-x86_64-unknown-linux-musl.tar.gz"
arm64 = "xh-*-aarch64-unknown-linux-musl.tar.gz"

[[release]]
name = "lazygit"
repo = "jesseduffield/lazygit"
amd64 = "lazygit_*_linux_x86_64.tar.gz"
arm64 = "lazygit_*_linux_arm64.tar.gz"

