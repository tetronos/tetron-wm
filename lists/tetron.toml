# Apps no distribution packages: the suite installer runs each one's own method.

[[script]]
name = "fresh"
set = "essentials"
how = "Homebrew fresh-editor on macOS; the project's own installer on Linux"

[[script]]
name = "catt"
set = "essentials"
how = "uv tool install catt"

[[script]]
name = "casttui"
set = "essentials"
how = "uv tool install from github.com/tetronos/casttui"

[[script]]
name = "nerd-font"
set = "essentials"
how = "Symbols Nerd Font: ~/.local/share/fonts on Linux, a Homebrew cask on macOS"

[[script]]
name = "helpers"
set = "essentials"
how = "tetron-wm-startpage and tetron-aimode from scripts/ into ~/.local/bin, only when tetron-wm is not the deb (the deb ships them)"

[[script]]
name = "opencode"
set = "essentials"
how = "the agent of ✦ AI: its stable release tarball for this CPU, checked against GitHub's sha256 digest, into ~/.local/bin (Homebrew on macOS); Settings > Updates replaces it the same way"

[[script]]
name = "croft"
set = "recommended"
how = "its musl release for this CPU, checked against the release's SHA256SUMS, into ~/.local/bin (Linux); it updates itself"

[[script]]
name = "pyradio"
set = "recommended"
how = "uv tool install from github.com/coderholic/pyradio with its Python dependencies; Settings > Updates upgrades the uv tools"

[[script]]
name = "llm"
set = "recommended"
how = "uv tool install llm --with llm-ollama; Settings > Updates upgrades the uv tools"

[[script]]
name = "yt-dlp"
set = "recommended"
how = "uv tool install yt-dlp[default,deno] (deno is the JS runtime it needs for YouTube, inside its venv), since distribution packages fall behind the sites; Settings > Updates upgrades the uv tools"

[[script]]
name = "freebuff"
set = "recommended"
how = "the native binary its npm launcher fetches from codebuff.com, checked against the sha256 the npm package lists, into ~/.local/share/freebuff linked from ~/.local/bin (Linux); Settings > Updates replaces it the same way"


# ── AI ──────────────────────────────────────────────────────────

[[app]]
name = "AI Mode"
bin = "tetron-aimode"
tier = "default"
category = "AI"
description = "Ask Gemini questions in a full screen terminal app, with optional Google Search grounding. Needs a free Gemini API key in GEMINI_API_KEY or ~/.config/aimode/key (https://aistudio.google.com/apikey)."
homepage = "https://github.com/tetronos/tetron-wm/tree/main/scripts"
[app.recipe]
install = "mkdir -p ~/.local/bin && curl -fsSL https://raw.githubusercontent.com/tetronos/tetron-wm/main/scripts/tetron-aimode -o ~/.local/bin/tetron-aimode && chmod +x ~/.local/bin/tetron-aimode"
method = "script"
verified = true
os = ["macos", "linux"]
tip = "Needs a free Gemini API key from https://aistudio.google.com/apikey. The first run asks for it and saves it to ~/.config/aimode/key (readable only by you); `tetron-aimode --key` replaces it, or set GEMINI_API_KEY. Google Search grounding (`tetron-aimode --search`) needs billing on the key."

[[app]]
name = "Aider"
bin = "aider"
category = "AI"
description = "AI pair programming tool that lets you edit code in your terminal using LLMs like Claude and GPT-4."
homepage = "https://aider.chat"
[app.recipe]
install = "pipx install aider-chat"
method = "pipx"
verified = true
os = ["macos", "linux", "windows"]
requires_cwd = true

[[app]]
name = "Amp"
distinct = true
bin = "amp"
category = "AI"
description = "An AI coding agent that runs in your terminal and lets you start, monitor, and drive agents from CLI, web, and mobile."
homepage = "https://ampcode.com"
[app.recipe]
install = "brew install ampcode/tap/ampcode"
method = "brew"
verified = true
os = ["macos", "linux", "windows"]
requires_cwd = true

[[app]]
name = "Auggie"
bin = "auggie"
category = "AI"
description = "Agentic AI coding assistant that runs in your terminal, understands your codebase, and makes code edits via natural language."
homepage = "https://github.com/augmentcode/auggie"
[app.recipe]
install = "npm install -g @augmentcode/auggie"
method = "npm"
verified = true
os = ["macos", "linux", "windows"]
requires_cwd = true

[[app]]
name = "Claude Code"
bin = "claude"
category = "AI"
description = "Anthropic's official AI coding assistant that runs as a terminal/TUI CLI for agentic coding tasks."
homepage = "https://code.claude.com"
[app.recipe]
install = "curl -fsSL https://claude.ai/install.sh | bash"
method = "script"
verified = true
os = ["macos", "linux", "windows"]
requires_cwd = true
tip = "First run: `claude` walks you through logging in with your Anthropic account (or set ANTHROPIC_API_KEY)."
[app.agent]
label = "Claude Code"
briefing = { args = ["--append-system-prompt-file", "{{BRIEFING}}"] }
mcp = { args = ["--mcp-config", "{{MCP_JSON}}"] }

[[app.variants]]
suffix = "⚠️"
args = ["--dangerously-skip-permissions"]
warn = "Runs Claude Code with --dangerously-skip-permissions: it can edit files and run commands without asking. Launch anyway?"

[[app]]
name = "Codex"
bin = "codex"
category = "AI"
description = "Lightweight agentic coding assistant that runs in your terminal, powered by OpenAI models."
[app.recipe]
install = "npm install -g @openai/codex"
method = "npm"
verified = true
os = ["macos", "linux", "windows"]
requires_cwd = true

[app.agent]
label = "Codex"
mcp = { args = ["-c", "mcp_servers.tetron-wm.command=\"{{MCP_BIN}}\"", "-c", "mcp_servers.tetron-wm.args=[\"mcp\"]"] }

