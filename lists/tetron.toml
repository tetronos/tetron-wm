[[app]]
name = "opencode"
category = "AI"
description = "Open-source AI coding agent built for the terminal with a TUI and support for 75+ LLM providers."
homepage = "https://github.com/anomalyco/opencode"
[app.recipe]
install = "case $(uname -m) in x86_64|amd64) a=x64; grep avx2 /proc/cpuinfo >/dev/null 2>&1 || a=x64-baseline;; aarch64|arm64) a=arm64;; *) echo 'no opencode build for this CPU'; exit 1;; esac; f=opencode-linux-$a.tar.gz; set -- $(curl -fsSL https://api.github.com/repos/anomalyco/opencode/releases/latest | python3 -c 'import json,sys; r=json.load(sys.stdin); a=[x for x in r[\"assets\"] if x[\"name\"]==sys.argv[1]][0]; print(a[\"browser_download_url\"], a[\"digest\"].split(\":\")[1])' $f) && d=$(mktemp -d) && curl -fsSL -o \"$d/$f\" \"$1\" && echo \"$2  $d/$f\" | sha256sum -c - && tar xzf \"$d/$f\" -C \"$d\" opencode && mkdir -p ~/.local/bin && install -m 755 \"$d/opencode\" ~/.local/bin/opencode && rm -rf \"$d\""
method = "binary"
verified = true
os = ["linux"]
requires_cwd = true
tip = "The agent of ✦ AI (Settings > AI). First run: `opencode auth login` to pick a provider and add a key; local models via Ollama are supported. Settings > Updates keeps this copy current."

