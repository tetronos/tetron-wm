homepage = "https://github.com/pepa65/kptui"
tier = "optional"
[app.recipe]
install = "[ \"$(uname -m)\" = x86_64 ] || { echo 'kptui: release binary is x86_64 only; elsewhere: cargo install kptui'; exit 1; }; mkdir -p ~/.local/bin && curl -fsSL -o ~/.local/bin/kptui https://github.com/pepa65/kptui/releases/latest/download/kptui && chmod 755 ~/.local/bin/kptui"
